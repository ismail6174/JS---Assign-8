
    
    <!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.1/lib/browser/math.min.js"></script>
</head>
<body>
  
  <!-- Calculator Section -->
  
  <div class="calculator">
    <div class="display-wrapper">
      <input type="text" class="expression" id="expression" disabled>
      <input type="text" class="result" id="result" disabled>
    </div>
    <div class="buttons" id="simpleCalc">
      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('/')">➗</button><button onclick="appendValue('4')">4</button>
  <button onclick="appendValue('5')">5</button>
  <button onclick="appendValue('6')">6</button>
  <button class="operator" onclick="appendValue('*')">❎</button>

  <button onclick="appendValue('1')">1</button>
  <button onclick="appendValue('2')">2</button>
  <button onclick="appendValue('3')">3</button>
  <button class="operator" onclick="appendValue('-')">➖</button>

  <button onclick="appendValue('0')">0</button>
  <button onclick="appendValue('.')">.</button>
  <button onclick="calculate()">=</button>
  <button class="operator" onclick="appendValue('+')">➕</button>

  <button class="operator" onclick="delLast()">DEL</button>
  <button class="operator"  onclick="clearDisplay()">C</button>
  <button class="operator" style="grid-column: span 2; background-color:#00c896;" onclick="toggleCalculator()">Adv.▶</button>
</div>

<!-- Advance operator Section -->

<div class="buttons hidden" id="advCalc">
  <button onclick="applyFunction('sin')">sin</button>
  <button onclick="applyFunction('cos')">cos</button>
  <button onclick="applyFunction('tan')">tan</button>
  <button onclick="applyFunction('sqrt')">√</button>

  <button onclick="applyFunction('pow2')">x²</button>
  <button onclick="applyFunction('pow3')">x³</button>
  <button onclick="applyFunction('pow10')">10^x</button>
  <button onclick="applyFunction('log')">log</button>

  <button onclick="applyFunction('exp')">exp</button>
  <button onclick="applyFunction('abs')">abs</button>
  <button onclick="applyFunction('fact')">x!</button>
  <button onclick="applyFunction('inv')">1/x</button>

  <button onclick="showConversions()">💱</button>

  <button class="operator" onclick="clearDisplay()">C</button>
  <button class="operator" style="grid-column: span 2; background-color:#00c896;" onclick="toggleCalculator()">◀Basic</button>
</div>

  </div>  <div class="utility">
    <button onclick="toggleFeatures()">Try Features ⚡</button>
    <div id="featuresPanel" class="hidden">
     
     <button onclick="showsquarelist()">square² list </button>
         <button onclick="toggleTheme()">‹🌗›</button>
     <button onclick="showcubelist()">cube³ list</button>

    </div>
    </div> 
  
 
    <script src="app.js"></script>
</body>
</html>
